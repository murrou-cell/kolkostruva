name: Build and deploy

on:
  schedule:
    - cron: "17 6,9,12,15,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and reduce the latest КЗП data
        env:
          DATA_DIR: ${{ github.workspace }}/_data
          BACKFILL_DAYS: "3"
          KEEP_DAYS: "1"
        run: python updater.py --once
      - name: Assemble site
        run: |
          test -s _data/latest.json || { echo "no data fetched"; exit 1; }
          mkdir -p _site/data
          cp -r web/. _site/
          cp _data/latest.json _data/meta.json _site/data/
          cp -r _data/cities _site/data/cities
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
