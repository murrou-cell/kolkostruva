name: maintenance
on:
  schedule:
    - cron: "43 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub disables scheduled workflows after 60 days without commits
      - name: keepalive commit when repo is idle for 30+ days
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $((30*86400)) ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
      # a failed run emails the repo owner
      - name: fail if published data is stale
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime, sys
          url = "https://murrou-cell.github.io/kolkostruva/data/meta.json"
          latest = json.load(urllib.request.urlopen(url, timeout=30))["latest"]
          age = (datetime.date.today() - datetime.date.fromisoformat(latest)).days
          print("latest", latest, "age", age)
          sys.exit(1 if age > 4 else 0)
          PY
